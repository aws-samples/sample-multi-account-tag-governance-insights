AWSTemplateFormatVersion: "2010-09-09"
Description: "TagInsights - Core Infrastructure Stack. S3 buckets, Glue database, Athena workgroup, Hub Event Bus, Central Results Queue. No Lambda — pure infrastructure. Deploy this first."

Parameters:
  ProjectName:
    Type: String
    Default: ti

  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, test, cert, uat, staging, prod]

  OrganizationId:
    Type: String
    Default: ""
    Description: >
      AWS Organization ID (e.g., o-abc123xyz). Required for multi-account deployments.
      Grants member accounts permission to forward tag events to the hub event bus.
    AllowedPattern: "^(o-[a-z0-9]{10,32})?$"
    ConstraintDescription: "Must be a valid organization ID starting with 'o-' or empty"

  AccessLogsBucketName:
    Type: String
    AllowedPattern: "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
    Description: >
      REQUIRED. Existing S3 bucket that receives server access logs for the buckets
      this stack creates, normally your organization's logging baseline bucket (for
      example from AWS Control Tower or Landing Zone Accelerator). S3 requires it to be
      in the same account and Region, without SSE-KMS default encryption, and with a
      bucket policy granting s3:PutObject to logging.s3.amazonaws.com.

  ForceDeleteOnStackRemoval:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      Set true to empty and delete all S3 buckets on stack removal.
      Automatically true for non-prod environments.
      WARNING: Permanently destroys all tag analytics data.

Conditions:
  EnableAggressiveCleanup: !Or
    - !Or
      - !Equals [!Ref Environment, "dev"]
      - !Equals [!Ref Environment, "test"]
      - !Equals [!Ref Environment, "cert"]
      - !Equals [!Ref Environment, "uat"]
      - !Equals [!Ref Environment, "staging"]
    - !Equals [!Ref ForceDeleteOnStackRemoval, "true"]

  HasOrganization: !Not [!Equals [!Ref OrganizationId, ""]]

Resources:
  # ============================================================================
  # S3 BUCKETS
  # ============================================================================

  CentralAnalyticsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: !If [EnableAggressiveCleanup, Delete, Retain]
    UpdateReplacePolicy: !If [EnableAggressiveCleanup, Delete, Retain]
    Properties:
      BucketName: !Sub "ti-central-analytics-${AWS::Region}-${Environment}-${AWS::AccountId}"
      LoggingConfiguration:
        DestinationBucketName: !Ref AccessLogsBucketName
        LogFilePrefix: "central-analytics/"
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        # Rules are scoped per prefix: S3 applies the shortest matching
        # expiration, so a bucket-wide 1-day noncurrent rule would override
        # the 7-day aggregator-state rule below.
        Rules:
          # Safety net only. The monthly aggregator compacts each calendar
          # month once it ended >= 28 days before the run (data 30-63 days
          # old on day 2) and then deletes those daily partitions; 130 days
          # leaves room for a few missed monthly runs before data is lost.
          # Pinned by test_recent_lifecycle_outlives_compaction_with_a_missed_run.
          - Id: DeleteOldRecent
            Status: Enabled
            Prefix: tag-deltas/recent/
            ExpirationInDays: 130
            NoncurrentVersionExpirationInDays: 1
          - Id: TransitionHistoricalToIA
            Status: Enabled
            Prefix: tag-deltas/historical/
            Transitions:
              - TransitionInDays: 90
                StorageClass: STANDARD_IA
            NoncurrentVersionExpirationInDays: 1
          - Id: DeleteTagCostAllocationOldVersions
            Status: Enabled
            Prefix: tag-cost-allocation/
            NoncurrentVersionExpirationInDays: 1
          # Cost Allocator UNLOAD staging: written and deleted on every run, so
          # only noncurrent versions and delete markers are left behind.
          - Id: DeleteTagCostAllocationStaging
            Status: Enabled
            Prefix: tag-cost-allocation-staging/
            NoncurrentVersionExpirationInDays: 1
            ExpiredObjectDeleteMarker: true
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
          # Raw Worker delta JSON is only staging for the Analytics Writer
          # (results queue + DLQ retain messages 14 days each).
          - Id: DeleteRawDeltas
            Status: Enabled
            Prefix: deltas/
            ExpirationInDays: 35
            NoncurrentVersionExpirationInDays: 1
          - Id: DeleteQuarantine
            Status: Enabled
            Prefix: quarantine/
            ExpirationInDays: 30
            NoncurrentVersionExpirationInDays: 1
          # Who-called-the-tag-API records (CloudTrail); kept about 13 months.
          - Id: DeleteOldTagChangeEvents
            Status: Enabled
            Prefix: tag-change-events/
            ExpirationInDays: 400
            NoncurrentVersionExpirationInDays: 1
          - Id: DeleteAggregatorStateOldVersions
            Status: Enabled
            Prefix: aggregator-state/
            NoncurrentVersionExpirationInDays: 7
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Application
          Value: TagInsights
        - Key: Environment
          Value: !Ref Environment
        - Key: Component
          Value: CentralAnalytics

  # TLS-only on every core bucket. v4 Workers write in the hub; no account
  # outside it may write here (the old org-wide replication grant is removed).
  CentralAnalyticsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CentralAnalyticsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt CentralAnalyticsBucket.Arn
              - !Sub "${CentralAnalyticsBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": false

  AthenaResultsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AthenaResultsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt AthenaResultsBucket.Arn
              - !Sub "${AthenaResultsBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": false

  AthenaResultsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: !If [EnableAggressiveCleanup, Delete, Retain]
    UpdateReplacePolicy: !If [EnableAggressiveCleanup, Delete, Retain]
    Properties:
      BucketName: !Sub "ti-athena-results-${AWS::Region}-${Environment}-${AWS::AccountId}"
      LoggingConfiguration:
        DestinationBucketName: !Ref AccessLogsBucketName
        LogFilePrefix: "athena-results/"
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldQueryResults
            Status: Enabled
            ExpirationInDays: 7
            NoncurrentVersionExpiration:
              NoncurrentDays: 1
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Application
          Value: TagInsights
        - Key: Environment
          Value: !Ref Environment
        - Key: Component
          Value: AthenaResults

  # ============================================================================
  # BUCKET EMPTIER (non-prod only)
  # ============================================================================

  BucketEmptierRole:
    Type: AWS::IAM::Role
    Condition: EnableAggressiveCleanup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      RoleName: !Sub "ti-bucket-emptier-${AWS::Region}-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: BucketEmptierPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:ListBucketVersions
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                  - s3:GetBucketVersioning
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::ti-*-${AWS::Region}-${Environment}-${AWS::AccountId}"
                  - !Sub "arn:${AWS::Partition}:s3:::ti-*-${AWS::Region}-${Environment}-${AWS::AccountId}/*"
              # Tells a stack delete from an update that only removes the emptier
              - Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Ref AWS::StackId

  BucketEmptierFunction:
    Type: AWS::Lambda::Function
    Condition: EnableAggressiveCleanup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      FunctionName: !Sub "ti-bucket-emptier-${Environment}-${AWS::AccountId}"
      Runtime: python3.14
      Handler: index.handler
      Role: !GetAtt BucketEmptierRole.Arn
      Timeout: 300
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          # Stop and report FAILED with this much time left, so CloudFormation
          # never waits an hour for a response from a timed-out function.
          SAFETY_MS = 30000
          def delete_batch(s3, bucket_name, objects):
              errors = s3.delete_objects(Bucket=bucket_name, Delete={'Objects': objects}).get('Errors', [])
              if errors:
                  raise RuntimeError(f"{len(errors)} objects not deleted, e.g. {errors[0]}")
          def empty_bucket(bucket_name, context):
              s3 = boto3.client('s3')
              try:
                  # Listing versions also covers unversioned buckets (VersionId 'null').
                  for page in s3.get_paginator('list_object_versions').paginate(Bucket=bucket_name):
                      if context.get_remaining_time_in_millis() < SAFETY_MS:
                          raise TimeoutError(f"Ran out of time emptying {bucket_name}; empty it manually and retry")
                      objects = [{'Key': v['Key'], 'VersionId': v['VersionId']}
                                 for v in page.get('Versions', []) + page.get('DeleteMarkers', [])]
                      if objects:
                          delete_batch(s3, bucket_name, objects)
                  print(f"Emptied bucket: {bucket_name}")
              except s3.exceptions.NoSuchBucket:
                  print(f"Bucket {bucket_name} does not exist, skipping")
          def stack_deleting(stack_id):
              # A Delete also arrives when an update drops this resource (e.g.
              # ForceDeleteOnStackRemoval true -> false); empty only on a stack delete.
              stack = boto3.client('cloudformation').describe_stacks(StackName=stack_id)['Stacks'][0]
              return stack['StackStatus'] in ('DELETE_IN_PROGRESS', 'ROLLBACK_IN_PROGRESS')
          def handler(event, context):
              bucket = event.get('ResourceProperties', {}).get('BucketName', 'unknown')
              try:
                  if event['RequestType'] == 'Delete':
                      if stack_deleting(event['StackId']):
                          empty_bucket(bucket, context)
                      else:
                          print(f"Stack not being deleted; keeping {bucket} contents")
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {}, physicalResourceId=bucket)
              except Exception as e:
                  print(f"BucketEmptier failed: {e}")
                  cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': str(e)}, physicalResourceId=bucket)

  CentralAnalyticsBucketEmptier:
    Type: Custom::BucketEmptier
    Condition: EnableAggressiveCleanup
    DependsOn: CentralAnalyticsBucket
    Properties:
      ServiceToken: !GetAtt BucketEmptierFunction.Arn
      BucketName: !Ref CentralAnalyticsBucket

  AthenaResultsBucketEmptier:
    Type: Custom::BucketEmptier
    Condition: EnableAggressiveCleanup
    DependsOn: AthenaResultsBucket
    Properties:
      ServiceToken: !GetAtt BucketEmptierFunction.Arn
      BucketName: !Ref AthenaResultsBucket

  # ============================================================================
  # GLUE DATABASE + TABLES
  # ============================================================================

  GlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Sub "ti_${AWS::Region}_${Environment}_${AWS::AccountId}"
        Description: TagInsights tag analytics database
        Parameters:
          project: !Ref ProjectName
          environment: !Ref Environment

  TagDeltasRecentTable:
    Type: AWS::Glue::Table
    DependsOn: [GlueDatabase, CentralAnalyticsBucket]
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabase
      TableInput:
        Name: resource_tag_deltas_recent
        Description: "Recent tag delta records (last 90 days) partitioned by account/date"
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: parquet
          "parquet.compression": SNAPPY
        StorageDescriptor:
          Location: !Sub "s3://${CentralAnalyticsBucket}/tag-deltas/recent/"
          InputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe
            Parameters:
              serialization.format: "1"
          Columns:
            - Name: arn
              Type: string
            - Name: resource_type
              Type: string
            - Name: tags
              Type: "map<string,string>"
            - Name: previous_tags
              Type: "map<string,string>"
            - Name: change_type
              Type: string
            - Name: timestamp
              Type: bigint
            - Name: source_system
              Type: string
            - Name: region
              Type: string
            - Name: scan_id
              Type: string
            # Appended last so older Parquet files (without them) still read
            - Name: changed_by
              Type: string
            - Name: event_name
              Type: string
        PartitionKeys:
          - Name: account_id
            Type: string
          - Name: year
            Type: int
          - Name: month
            Type: int
          - Name: day
            Type: int

  TagDeltasHistoricalTable:
    Type: AWS::Glue::Table
    DependsOn: [GlueDatabase, CentralAnalyticsBucket]
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabase
      TableInput:
        Name: resource_tag_deltas_historical
        Description: "Aggregated historical tag delta records partitioned by account/month"
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: parquet
          "parquet.compression": SNAPPY
        StorageDescriptor:
          Location: !Sub "s3://${CentralAnalyticsBucket}/tag-deltas/historical/"
          InputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe
            Parameters:
              serialization.format: "1"
          Columns:
            - Name: arn
              Type: string
            - Name: resource_type
              Type: string
            - Name: tags
              Type: "map<string,string>"
            - Name: previous_tags
              Type: "map<string,string>"
            - Name: change_type
              Type: string
            - Name: first_seen_timestamp
              Type: bigint
            - Name: last_seen_timestamp
              Type: bigint
            - Name: change_count
              Type: int
            - Name: source_system
              Type: string
            - Name: region
              Type: string
            # Appended last so older Parquet files (without them) still read.
            # Written by the monthly aggregator.
            - Name: changed_by
              Type: string
            - Name: event_name
              Type: string
        PartitionKeys:
          - Name: account_id
            Type: string
          - Name: year
            Type: int
          - Name: month
            Type: int

  # ============================================================================
  # ATHENA WORKGROUP
  # ============================================================================

  # Caller identity for tag API calls (CloudTrail). The delta tables stay change-only;
  # join on arn and time to see who made a change. Partition projection: no partitions to manage.
  TagChangeEventsTable:
    Type: AWS::Glue::Table
    DependsOn: [GlueDatabase, CentralAnalyticsBucket]
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabase
      TableInput:
        Name: tag_change_events
        Description: "Who called a tag API (from CloudTrail), one row per resource per call"
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: json
          projection.enabled: "true"
          projection.year.type: integer
          projection.year.range: "2020,2100"
          projection.month.type: integer
          projection.month.range: "1,12"
          projection.day.type: integer
          projection.day.range: "1,31"
          storage.location.template: !Sub "s3://${CentralAnalyticsBucket}/tag-change-events/year=${!year}/month=${!month}/day=${!day}/"
        PartitionKeys:
          - Name: year
            Type: int
          - Name: month
            Type: int
          - Name: day
            Type: int
        StorageDescriptor:
          Location: !Sub "s3://${CentralAnalyticsBucket}/tag-change-events/"
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.openx.data.jsonserde.JsonSerDe
            # Tag keys are case-sensitive; the SerDe lower-cases map keys by default.
            Parameters:
              case.insensitive: "false"
          Columns:
            - Name: event_time
              Type: bigint
              Comment: CloudTrail eventTime, epoch seconds
            - Name: event_id
              Type: string
            - Name: event_name
              Type: string
            - Name: account_id
              Type: string
            - Name: region
              Type: string
            - Name: arn
              Type: string
            - Name: changed_by
              Type: string
              Comment: CloudTrail userIdentity ARN (or principalId)
            - Name: principal_type
              Type: string
            - Name: tags_set
              Type: map<string,string>
            - Name: tags_removed
              Type: array<string>

  AthenaWorkgroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: !Sub "ti-${AWS::Region}-${Environment}-${AWS::AccountId}"
      Description: TagInsights analytics workgroup
      State: ENABLED
      WorkGroupConfiguration:
        ResultConfiguration:
          OutputLocation: !Sub "s3://${AthenaResultsBucket}/query-results/"
          EncryptionConfiguration:
            EncryptionOption: SSE_S3
        EnforceWorkGroupConfiguration: true
        PublishCloudWatchMetricsEnabled: true
      Tags:
        - Key: Application
          Value: TagInsights
        - Key: Environment
          Value: !Ref Environment

  # ============================================================================
  # HUB EVENT BUS
  # Receives forwarded tag change events from member accounts via EventBridge
  # cross-account forwarding (event-forwarder-stack.yaml StackSet).
  # ============================================================================

  HubEventBus:
    Type: AWS::Events::EventBus
    DeletionPolicy: !If [EnableAggressiveCleanup, Delete, Retain]
    UpdateReplacePolicy: !If [EnableAggressiveCleanup, Delete, Retain]
    Properties:
      Name: !Sub "${ProjectName}-hub-${Environment}"
      Tags:
        - Key: Application
          Value: TagInsights
        - Key: Environment
          Value: !Ref Environment

  HubEventBusPolicy:
    Type: AWS::Events::EventBusPolicy
    Condition: HasOrganization
    Properties:
      EventBusName: !Ref HubEventBus
      StatementId: AllowOrgAccountsToForwardEvents
      Statement:
        Effect: Allow
        Principal:
          AWS: "*"
        Action: events:PutEvents
        Resource: !GetAtt HubEventBus.Arn
        Condition:
          StringEquals:
            "aws:PrincipalOrgID": !Ref OrganizationId

  # ============================================================================
  # CENTRAL RESULTS QUEUE
  # Analytics Writer Lambda polls this queue to process tag delta notifications.
  # ============================================================================

  # Customer managed key for messaging that AWS services publish to:
  # EventBridge -> forwarded-events SQS queue, CloudWatch alarm -> SNS topic.
  # The AWS managed keys (alias/aws/sqs, alias/aws/sns) can't be used by those
  # service publishers, so they need a key whose policy allows them.
  MessagingKey:
    Type: AWS::KMS::Key
    DeletionPolicy: !If [EnableAggressiveCleanup, Delete, Retain]
    UpdateReplacePolicy: !If [EnableAggressiveCleanup, Delete, Retain]
    Properties:
      Description: TagInsights encryption for EventBridge-fed SQS and CloudWatch-fed SNS
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          - Sid: AllowServicePublishers
            Effect: Allow
            Principal:
              Service:
                - events.amazonaws.com
                - cloudwatch.amazonaws.com
            Action:
              - kms:GenerateDataKey*
              - kms:Decrypt
            Resource: "*"
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref AWS::AccountId
      Tags:
        - Key: Application
          Value: TagInsights
        - Key: Environment
          Value: !Ref Environment

  MessagingKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${ProjectName}-messaging-${Environment}"
      TargetKeyId: !Ref MessagingKey

  CentralResultQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: !If [EnableAggressiveCleanup, Delete, Retain]
    UpdateReplacePolicy: !If [EnableAggressiveCleanup, Delete, Retain]
    Properties:
      QueueName: !Sub "ti-central-results-${Environment}-${AWS::AccountId}"
      KmsMasterKeyId: alias/aws/sqs
      VisibilityTimeout: 1800
      MessageRetentionPeriod: 1209600
      ReceiveMessageWaitTimeSeconds: 20
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt CentralResultDLQ.Arn
        maxReceiveCount: 5
      Tags:
        - Key: Application
          Value: TagInsights
        - Key: Environment
          Value: !Ref Environment

  CentralResultDLQ:
    Type: AWS::SQS::Queue
    DeletionPolicy: !If [EnableAggressiveCleanup, Delete, Retain]
    UpdateReplacePolicy: !If [EnableAggressiveCleanup, Delete, Retain]
    Properties:
      QueueName: !Sub "ti-central-results-dlq-${Environment}-${AWS::AccountId}"
      KmsMasterKeyId: alias/aws/sqs
      MessageRetentionPeriod: 1209600
      Tags:
        - Key: Application
          Value: TagInsights
        - Key: Environment
          Value: !Ref Environment

  CentralResultQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref CentralResultQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowSameAccountCrossRegion
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: sqs:SendMessage
            Resource: !GetAtt CentralResultQueue.Arn

  # CloudWatch alarm on DLQ
  CentralResultDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "ti-central-results-dlq-${Environment}"
      AlarmDescription: "Tag delta messages failing to process — check Analytics Writer Lambda"
      MetricName: ApproximateNumberOfMessagesVisible
      Namespace: AWS/SQS
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: QueueName
          Value: !GetAtt CentralResultDLQ.QueueName
      TreatMissingData: notBreaching

# ============================================================================
# OUTPUTS — exported for use by aggregator-stack.yaml and other stacks
# ============================================================================

Outputs:
  MessagingKeyArn:
    Description: KMS key for EventBridge-fed SQS and CloudWatch-fed SNS
    Value: !GetAtt MessagingKey.Arn
    Export:
      Name: !Sub "ti-messaging-key-arn-${Environment}"

  CentralAnalyticsBucketName:
    Value: !Ref CentralAnalyticsBucket
    Export:
      Name: !Sub "ti-central-analytics-bucket-${Environment}"

  CentralAnalyticsBucketArn:
    Value: !GetAtt CentralAnalyticsBucket.Arn
    Export:
      Name: !Sub "ti-central-analytics-bucket-arn-${Environment}"

  AthenaResultsBucketName:
    Value: !Ref AthenaResultsBucket
    Export:
      Name: !Sub "ti-athena-results-bucket-${Environment}"

  GlueDatabaseName:
    Value: !Ref GlueDatabase
    Export:
      Name: !Sub "ti-glue-database-${Environment}"

  AthenaWorkgroupName:
    Value: !Ref AthenaWorkgroup
    Export:
      Name: !Sub "ti-athena-workgroup-${Environment}"

  HubEventBusArn:
    Value: !GetAtt HubEventBus.Arn
    Export:
      Name: !Sub "ti-hub-event-bus-arn-${Environment}"

  HubEventBusName:
    Value: !Ref HubEventBus
    Export:
      Name: !Sub "ti-hub-event-bus-name-${Environment}"

  CentralResultQueueUrl:
    Value: !Ref CentralResultQueue
    Export:
      Name: !Sub "ti-central-results-queue-url-${Environment}"

  CentralResultQueueArn:
    Value: !GetAtt CentralResultQueue.Arn
    Export:
      Name: !Sub "ti-central-results-queue-arn-${Environment}"

  AccessLogsBucketName:
    Value: !Ref AccessLogsBucketName
    Export:
      Name: !Sub "ti-access-logs-bucket-${Environment}"
