AWSTemplateFormatVersion: "2010-09-09"
Description: "TagInsights - Cost Analysis Stack (daily set-based tag cost allocation from CUR via Athena UNLOAD)"

Parameters:
  ProjectName:
    Type: String
    Default: ti
    Description: Name of the project for tagging resources

  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, test, cert, uat, staging, prod]
    Description: Environment name

  LambdaCodeBucket:
    Type: String
    Description: S3 bucket name for Lambda deployment artifacts

  CurDatabaseName:
    Type: String
    Default: ""
    Description: >
      Glue database name for the CUR table. When provided, the cost allocator
      role is granted Glue permissions scoped to this database only.

  CurTableName:
    Type: String
    Default: ""
    Description: >
      Glue table name for the CUR data. Required when CurDatabaseName is set.

  CurBucketName:
    Type: String
    AllowedPattern: "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
    ConstraintDescription: "Must be a valid S3 bucket name (3-63 chars, lowercase, no empty strings)"
    Description: >
      S3 bucket name where CUR data is stored (e.g., 'amzn-s3-demo-cur-bucket').
      Required — IAM access is scoped to this specific bucket.

  CurCatalogAccountId:
    Type: String
    Default: ""
    AllowedPattern: "^([0-9]{12})?$"
    Description: >
      Billing account that owns the CUR Glue table, when it is not this account.
      Registers that account's Glue Data Catalog in Athena so the cost allocator
      can join CUR to tag history in one query. The billing account must grant
      the allocator role Glue and S3 read (docs/cost-analysis/README.md,
      "Cross-account CUR"). Leave empty when CUR is in this account.

  DeploymentVersion:
    Type: String
    AllowedPattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"
    ConstraintDescription: >
      Must be 1-64 letters, numbers, dots, underscores, or hyphens.
    Description: Immutable version segment shared by all Lambda ZIPs.

  EnableCodeSigning:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      Enforce AWS Signer code signing on the Lambda and load it from signed/v<version>/.
      Requires the taginsights-lambda-signer profile and packages built with
      package_lambdas.py --sign. Independent of Environment.

  CurKmsKeyArn:
    Type: String
    Default: ""
    AllowedPattern: "^(arn:[a-z-]+:kms:[a-z0-9-]+:[0-9]{12}:key/[A-Za-z0-9-]+)?$"
    Description: >
      KMS key that encrypts the CUR bucket (SSE-KMS), usually in the billing account.
      When set, the cost allocator role gets kms:Decrypt on it through S3 only; the key
      policy must also allow this role. Leave empty for SSE-S3.

  LogLevel:
    Type: String
    Default: INFO
    AllowedValues: [DEBUG, INFO, WARNING, ERROR]

Conditions:
  # True when CUR database is explicitly configured
  HasCurDatabase: !Not [!Equals [!Ref CurDatabaseName, ""]]
  HasCurTable: !Not [!Equals [!Ref CurTableName, ""]]
  HasCurDatabaseAndTable: !And
    - !Condition HasCurDatabase
    - !Condition HasCurTable
  HasCurCatalog: !And
    - !Not [!Equals [!Ref CurCatalogAccountId, ""]]
    - !Condition HasCurDatabaseAndTable
  HasCurKmsKey: !Not [!Equals [!Ref CurKmsKeyArn, ""]]

  UseCodeSigning: !Equals [!Ref EnableCodeSigning, "true"]

Resources:
  CurDataCatalog:
    Type: AWS::Athena::DataCatalog
    Condition: HasCurCatalog
    Properties:
      Name: !Sub "${ProjectName}_cur_${Environment}"
      Type: GLUE
      Description: TagInsights - CUR Glue catalog in the billing account
      Parameters:
        catalog-id: !Ref CurCatalogAccountId
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # Stateless, fixed-name resources use the default Delete policy: a retained
  # role or function would block the next deployment with "already exists".
  CostAllocatorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-cost-alloc-${AWS::Region}-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: CostAllocatorPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Athena UNLOAD execution — TagInsights workgroup only
              - Effect: Allow
                Action:
                  - athena:StartQueryExecution
                  - athena:GetQueryExecution
                  - athena:StopQueryExecution
                  - athena:GetWorkGroup
                Resource:
                  - !Sub
                    - "arn:${AWS::Partition}:athena:${AWS::Region}:${AWS::AccountId}:workgroup/${WorkgroupName}"
                    - WorkgroupName: !ImportValue
                        Fn::Sub: "ti-athena-workgroup-${Environment}"

              # Glue read — TagInsights analytics database (tag history tables)
              - Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:GetTable
                  - glue:GetPartitions
                Resource:
                  - !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog"
                  - !Sub
                    - "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:database/${DatabaseName}"
                    - DatabaseName: !ImportValue
                        Fn::Sub: "ti-glue-database-${Environment}"
                  - !Sub
                    - "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${DatabaseName}/*"
                    - DatabaseName: !ImportValue
                        Fn::Sub: "ti-glue-database-${Environment}"

              # Glue read — configured CUR database and table only (billing account's catalog when cross-account)
              - !If
                - HasCurDatabaseAndTable
                - Effect: Allow
                  Action:
                    - glue:GetDatabase
                    - glue:GetTable
                    - glue:GetPartition
                    - glue:GetPartitions
                  Resource:
                    - !Sub
                      - "arn:${AWS::Partition}:glue:${AWS::Region}:${Owner}:catalog"
                      - Owner: !If [HasCurCatalog, !Ref CurCatalogAccountId, !Ref AWS::AccountId]
                    - !Sub
                      - "arn:${AWS::Partition}:glue:${AWS::Region}:${Owner}:database/${CurDatabaseName}"
                      - Owner: !If [HasCurCatalog, !Ref CurCatalogAccountId, !Ref AWS::AccountId]
                    - !Sub
                      - "arn:${AWS::Partition}:glue:${AWS::Region}:${Owner}:table/${CurDatabaseName}/${CurTableName}"
                      - Owner: !If [HasCurCatalog, !Ref CurCatalogAccountId, !Ref AWS::AccountId]
                - !Ref AWS::NoValue

              - !If
                - HasCurCatalog
                - Effect: Allow
                  Action:
                    - athena:GetDataCatalog
                  Resource:
                    - !Sub "arn:${AWS::Partition}:athena:${AWS::Region}:${AWS::AccountId}:datacatalog/${ProjectName}_cur_${Environment}"
                - !Ref AWS::NoValue

              # S3 read — CUR data (Athena reads with the caller's credentials)
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${CurBucketName}"
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${CurBucketName}/*"

              # KMS decrypt for an SSE-KMS CUR bucket, only when S3 calls KMS on the role's behalf
              - !If
                - HasCurKmsKey
                - Effect: Allow
                  Action:
                    - kms:Decrypt
                  Resource:
                    - !Ref CurKmsKeyArn
                  Condition:
                    StringEquals:
                      kms:ViaService: !Sub "s3.${AWS::Region}.${AWS::URLSuffix}"
                - !Ref AWS::NoValue

              # S3 analytics bucket — list only the tag history and allocation prefixes
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  - !ImportValue
                    Fn::Sub: "ti-central-analytics-bucket-arn-${Environment}"
                Condition:
                  StringLike:
                    s3:prefix:
                      - "tag-deltas/*"
                      - "tag-cost-allocation/*"
                      - "tag-cost-allocation-staging/*"
              - Effect: Allow
                Action:
                  - s3:GetBucketLocation
                Resource:
                  - !ImportValue
                    Fn::Sub: "ti-central-analytics-bucket-arn-${Environment}"

              # S3 analytics bucket — read tag history (SELECT source)
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub
                    - "${BucketArn}/tag-deltas/*"
                    - BucketArn: !ImportValue
                        Fn::Sub: "ti-central-analytics-bucket-arn-${Environment}"

              # S3 analytics bucket — UNLOAD to the staging prefix, then replace the live month prefix
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:AbortMultipartUpload
                Resource:
                  - !Sub
                    - "${BucketArn}/tag-cost-allocation/*"
                    - BucketArn: !ImportValue
                        Fn::Sub: "ti-central-analytics-bucket-arn-${Environment}"
                  - !Sub
                    - "${BucketArn}/tag-cost-allocation-staging/*"
                    - BucketArn: !ImportValue
                        Fn::Sub: "ti-central-analytics-bucket-arn-${Environment}"

              # S3 access for Athena results bucket
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::ti-athena-results-${AWS::Region}-${Environment}-${AWS::AccountId}"
                  - !Sub "arn:${AWS::Partition}:s3:::ti-athena-results-${AWS::Region}-${Environment}-${AWS::AccountId}/*"

  # ============================================================================
  # LAMBDA CODE SIGNING (EnableCodeSigning=true)
  # ONE-TIME SETUP: aws signer put-signing-profile --profile-name taginsights-lambda-signer --platform-id AWSLambda-SHA384-ECDSA
  # ============================================================================

  LambdaCodeSigningConfig:
    Type: AWS::Lambda::CodeSigningConfig
    Condition: UseCodeSigning
    Properties:
      Description: !Sub "TagInsights Lambda code signing enforcement — ${Environment}"
      AllowedPublishers:
        SigningProfileVersionArns:
          - !Sub "arn:${AWS::Partition}:signer:${AWS::Region}:${AWS::AccountId}:/signing-profiles/taginsights-lambda-signer"
      CodeSigningPolicies:
        UntrustedArtifactOnDeployment: Enforce
      Tags:
        - Key: Application
          Value: TagInsights
        - Key: Environment
          Value: !Ref Environment
        - Key: SecurityControl
          Value: "CodeSigning"

  # ============================================================================
  # LAMBDA FUNCTIONS
  # ============================================================================

  CostAllocatorLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-cost-alloc-${Environment}-${AWS::AccountId}"
      Runtime: python3.14
      Handler: index.lambda_handler
      Role: !GetAtt CostAllocatorRole.Arn
      Timeout: 900
      MemorySize: 512
      # One run at a time: concurrent runs would race on replacing the same month prefix.
      ReservedConcurrentExecutions: 1
      Environment:
        Variables:
          PROJECT_NAME: !Ref ProjectName
          ENVIRONMENT: !Ref Environment
          HUB_REGION: !Ref AWS::Region
          CENTRAL_ANALYTICS_BUCKET: !ImportValue
            Fn::Sub: "ti-central-analytics-bucket-${Environment}"
          ATHENA_DATABASE: !ImportValue
            Fn::Sub: "ti-glue-database-${Environment}"
          ATHENA_WORKGROUP: !ImportValue
            Fn::Sub: "ti-athena-workgroup-${Environment}"
          ATHENA_RESULTS_BUCKET: !Sub "ti-athena-results-${AWS::Region}-${Environment}-${AWS::AccountId}"
          CUR_ATHENA_DATABASE: !If [HasCurDatabaseAndTable, !Ref CurDatabaseName, ""]
          CUR_ATHENA_TABLE: !If [HasCurDatabaseAndTable, !Ref CurTableName, ""]
          # Cross-account CUR is read through CurDataCatalog.
          CUR_DATA_CATALOG: !If [HasCurCatalog, !Ref CurDataCatalog, ""]
          CUR_CATALOG_ID: !If [HasCurCatalog, !Ref CurCatalogAccountId, ""]
          LOG_LEVEL: !Ref LogLevel
      CodeSigningConfigArn:
        !If [UseCodeSigning, !Ref LambdaCodeSigningConfig, !Ref AWS::NoValue]
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !If
          - UseCodeSigning
          - !Sub "signed/v${DeploymentVersion}/cost_allocator.zip"
          - !Sub "lambda-packages/v${DeploymentVersion}/cost_allocator.zip"
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Component
          Value: CostAllocator

  CostAllocationSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ProjectName}-cost-alloc-${Environment}"
      Description: "Recompute set-based tag cost allocation daily (current and previous month)"
      State: ENABLED
      ScheduleExpression: "cron(0 6 * * ? *)"
      Targets:
        - Arn: !GetAtt CostAllocatorLambda.Arn
          Id: CostAllocatorTarget
          Input: |
            {
              "trigger_source": "scheduled"
            }

  CostAllocationSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CostAllocatorLambda
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !GetAtt CostAllocationSchedule.Arn

  # ============================================================================
  # CLOUDWATCH ALARMS
  # ============================================================================

  CostAllocatorErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-cost-allocator-errors-${Environment}"
      AlarmDescription: "Daily cost allocation failed"
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref CostAllocatorLambda
      TreatMissingData: notBreaching

  CostAllocatorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${CostAllocatorLambda}"
      RetentionInDays: 30
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # ============================================================================
  # SET-BASED TAG COST ALLOCATION TABLE
  # Written by CostAllocatorLambda via Athena UNLOAD; partition projection means
  # no partition registration is needed.
  # ============================================================================

  TagCostAllocationTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !ImportValue
        Fn::Sub: "ti-glue-database-${Environment}"
      TableInput:
        Name: tag_cost_allocation
        Description: "Set-based tag cost allocation (daily cost per resource and tag), partitioned by year/month"
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: parquet
          "parquet.compression": SNAPPY
          projection.enabled: "true"
          projection.year.type: integer
          projection.year.range: "2020,2100"
          projection.month.type: integer
          projection.month.range: "1,12"
          storage.location.template: !Sub
            - "s3://${Bucket}/tag-cost-allocation/year=${!year}/month=${!month}/"
            - Bucket: !ImportValue
                Fn::Sub: "ti-central-analytics-bucket-${Environment}"
        StorageDescriptor:
          Location: !Sub
            - "s3://${Bucket}/tag-cost-allocation/"
            - Bucket: !ImportValue
                Fn::Sub: "ti-central-analytics-bucket-${Environment}"
          InputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe
            Parameters:
              serialization.format: "1"
          Columns:
            - Name: account_id
              Type: string
            - Name: resource_arn
              Type: string
            - Name: resource_type
              Type: string
            - Name: region
              Type: string
            - Name: usage_date
              Type: date
            - Name: tag_key
              Type: string
            - Name: tag_value
              Type: string
            - Name: tags_assumed
              Type: boolean
            - Name: cost
              Type: double
        PartitionKeys:
          - Name: year
            Type: int
          - Name: month
            Type: int

# ============================================================================
# OUTPUTS
# ============================================================================

Outputs:
  CostAllocatorLambdaArn:
    Description: Cost Allocator Lambda ARN
    Value: !GetAtt CostAllocatorLambda.Arn
    Export:
      Name: !Sub "${ProjectName}-cost-alloc-lambda-${Environment}"
