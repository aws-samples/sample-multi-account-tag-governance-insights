# Loguru Configuration File for TagInsights
# This file can be used to configure loguru settings without code changes

[DEFAULT]
# Default logging level
LOG_LEVEL = INFO

# Log directory
LOG_DIR = logs

# Enable console logging (true/false)
ENABLE_CONSOLE_LOGGING = true

# Enable file logging (true/false)
ENABLE_FILE_LOGGING = true

# Log rotation policy
# Options: size-based (e.g., "100 MB", "50 MB") or time-based (e.g., "1 day", "12:00")
LOG_ROTATION = 100 MB

# Log retention policy
# Options: time-based (e.g., "30 days", "1 week") or count-based (e.g., "10")
LOG_RETENTION = 30 days

[DEVELOPMENT]
LOG_LEVEL = DEBUG
LOG_ROTATION = 10 MB
LOG_RETENTION = 7 days
ENABLE_CONSOLE_LOGGING = true
ENABLE_FILE_LOGGING = true

[PRODUCTION]
LOG_LEVEL = INFO
LOG_ROTATION = 100 MB  
LOG_RETENTION = 30 days
ENABLE_CONSOLE_LOGGING = false
ENABLE_FILE_LOGGING = true

[TESTING]
LOG_LEVEL = WARNING
ENABLE_CONSOLE_LOGGING = true
ENABLE_FILE_LOGGING = false
